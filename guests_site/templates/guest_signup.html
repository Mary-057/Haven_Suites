<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Haven Suites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input { padding: 0.75rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; width: 100%; box-sizing: border-box; }
        label { font-weight: 600; color: #334155; }
        ul.errorlist { color: #ef4444; font-size: 0.875rem; list-style: none; padding: 0; }
        p { margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-extrabold text-slate-900 mb-6 text-center">Create a Guest Account</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-slate-800 transition mt-4">
                Sign Up
            </button>
        </form>

        <p class="mt-6 text-center text-slate-500">
            Already have an account? <a href="{% url 'login' %}" class="text-slate-900 font-bold hover:underline">Log in here</a>.
        </p>
    </div>

</body>
</html>
