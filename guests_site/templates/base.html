<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Haven Suites{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

    <!-- Professional Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/dashboard/" class="text-lg font-semibold tracking-wide">Haven Suites</a>
            <nav class="space-x-6 text-sm font-medium text-slate-300">
                {% if user.is_authenticated %}
                    <a href="/dashboard/" class="hover:text-white transition">Dashboard</a>
                    <a href="/register/" class="hover:text-white transition">New Booking</a>
                    <a href="/staff/add/" class="hover:text-white transition">Add Staff</a>
                    <a href="/accounts/logout/" class="hover:text-red-400 transition">Logout</a>
                {% else %}
                    <a href="/accounts/login/" class="hover:text-white transition">Staff Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-10 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 text-center py-6 text-sm text-slate-500">
        &copy; 2026 Haven Suites. Built with Django.
    </footer>

</body>
</html>
